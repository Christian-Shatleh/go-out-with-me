<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Little Question 💗</title>
<style>
:root{font-family:ui-rounded,'Segoe UI',Arial,sans-serif;color:#9e4267}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#fff 0%,#fff8fa 50%,#fff0f5 100%);overflow:hidden}.hearts{position:fixed;inset:0;pointer-events:none}.heart{position:absolute;bottom:-35px;opacity:.45;animation:rise linear infinite;font-size:18px}@keyframes rise{to{transform:translateY(-110vh) rotate(30deg);opacity:0}}.card{width:min(92vw,430px);background:rgba(255,255,255,.93);border:1px solid #ffe2eb;box-shadow:0 20px 65px #df7c9b30,0 3px 12px #eeb5c52a;border-radius:22px;padding:36px 29px;text-align:center;position:relative;z-index:1;animation:pop .45s ease}@keyframes pop{from{transform:scale(.92) translateY(10px);opacity:0}to{transform:scale(1);opacity:1}}.emblem{width:52px;height:52px;display:grid;place-items:center;margin:0 auto 15px;border-radius:50%;background:#ffe8f0;font-size:24px}h1{font-size:25px;line-height:1.3;margin:0 0 10px;color:#e34f87}p{font-size:13px;line-height:1.7;color:#a78b99;margin:0 auto 23px;max-width:300px}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:13px 24px;font-weight:750;cursor:pointer;transition:transform .2s,box-shadow .2s;font-size:14px}.btn:hover{transform:translateY(-2px);box-shadow:0 7px 17px #e75e9230}.pink{background:#ee4f8b;color:white}.green{background:#15c65b;color:white}.light{background:#fff0f5;color:#d64f80}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}.option{min-height:82px;background:#fffafd;border:1px solid #f8dce7;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;cursor:pointer;color:#9b5570;font-weight:650;font-size:12px;transition:.2s}.option span{font-size:23px}.option:hover,.option.selected{background:#ffeaf2;border-color:#ef70a1;transform:translateY(-2px)}input{width:100%;padding:13px;border:1px solid #f5d2df;border-radius:9px;outline:none;color:#9e4267;margin-bottom:13px}input:focus{border-color:#ed6697}.small{font-size:11px;margin-top:16px;color:#c6aab6}.summary{text-align:left;background:#fff6f9;padding:16px;border-radius:12px;line-height:2;font-size:13px;color:#a05d79;margin:18px 0;overflow-wrap:anywhere}.hidden{display:none}#no{position:relative}.confetti{position:fixed;pointer-events:none;z-index:5;animation:fall 2.8s ease-in forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}@media(max-width:400px){.card{padding:29px 19px}h1{font-size:22px}}
</style>
</head>
<body>
<div class="hearts" id="hearts"></div><main class="card" id="card" aria-live="polite"></main>
<script>
const card=document.getElementById('card');let activity='',place='',contact='',noCount=0;
for(let i=0;i<26;i++){let h=document.createElement('span');h.className='heart';h.textContent=['💕','💗','✨','💖','🌸'][i%5];h.style.left=Math.random()*100+'%';h.style.animationDuration=8+Math.random()*12+'s';h.style.animationDelay=-Math.random()*20+'s';h.style.fontSize=10+Math.random()*16+'px';document.getElementById('hearts').append(h)}
function render(html){card.style.animation='none';void card.offsetWidth;card.style.animation='pop .45s ease';card.innerHTML=html}
function intro(){render(`<div class="emblem">💌</div><h1>Hey there!</h1><p>I made a little something just for you, because there's something I've been wanting to ask... 💕</p><button class="btn pink" onclick="question()">What is it? →</button><div class="small">Made with a little courage and lots of 💗</div>`)}
function question(){render(`<div class="emblem">💗</div><h1>Will you go out with me?</h1><p>I promise good vibes, lots of laughs, and a really lovely time together. 🥹</p><div class="actions"><button class="btn green" onclick="yes()">Yes 💖</button><button class="btn light" id="no" onmouseenter="dodge()" onclick="dodge()">No 🙈</button></div><div class="small">No pressure... but the hearts are rooting for us 💕</div>`)}
function dodge(){noCount++;const b=document.getElementById('no');if(!b)return;b.textContent=['Are you sure? 🥺','Think again 💕','Pretty please? 🌷','One more chance? 💗'][Math.min(noCount-1,3)];if(noCount>1){b.style.transform=`translate(${Math.round((Math.random()-.5)*110)}px,${Math.round((Math.random()-.5)*45)}px)`}}
function celebrate(){for(let i=0;i<65;i++){const c=document.createElement('span');c.className='confetti';c.textContent=['💗','💕','✨','🌸'][i%4];c.style.left=Math.random()*100+'vw';c.style.top='-30px';c.style.fontSize=12+Math.random()*20+'px';c.style.animationDelay=Math.random()*.9+'s';document.body.append(c);setTimeout(()=>c.remove(),4000)}}
function yes(){celebrate();render(`<div class="emblem">💖</div><h1>YAAAAY!!!</h1><p>You just made me the happiest person alive! 🥹💗<br>Let's make some memories together.</p><button class="btn pink" onclick="chooseActivity()">Let's plan it →</button>`)}
const activities=[['☕','Coffee date'],['🍽️','Dinner'],['🍦','Ice cream'],['🌅','Sunset walk'],['🎲','Surprise me']];
function chooseActivity(){render(`<div class="emblem">💞</div><h1>What should we do?</h1><p>Pick the kind of outing that sounds fun to you!</p><div class="options">${activities.map(([e,t])=>`<button class="option" onclick="setActivity('${t.replace(/'/g,"\\'")}')"><span>${e}</span>${t}</button>`).join('')}</div><div class="small">Every option sounds better with you 💗</div>`)}
function setActivity(v){activity=v;choosePlace()}
const places=[['🌷','Somewhere cute'],['🌳','Outdoors'],['🏙️','Around town'],['🎁','You surprise me']];
function choosePlace(){render(`<div class="emblem">📍</div><h1>Where should we go?</h1><p>Choose your favorite vibe 💕</p><div class="options">${places.map(([e,t])=>`<button class="option" onclick="setPlace('${t}')"><span>${e}</span>${t}</button>`).join('')}</div>`)}
function setPlace(v){place=v;render(`<div class="emblem">💌</div><h1>How can I reach you?</h1><p>Leave your number or Instagram (optional), so we can make a plan!</p><input id="contact" placeholder="Phone number or @username" autocomplete="off"><button class="btn pink" onclick="finish()">Next 💗</button><div class="small">You can leave this blank, too!</div>`)}
function finish(){contact=document.getElementById('contact').value.trim();celebrate();render(`<div class="emblem">✅</div><h1>Perfect! 🎉</h1><p>It's officially a plan! I can't wait to see you 💗</p><div class="summary">💗 <b>Our plan</b><br>🎀 Activity: ${escapeHtml(activity)}<br>📍 Vibe: ${escapeHtml(place)}<br>💌 Contact: ${escapeHtml(contact||'We’ll figure it out together')}</div><button class="btn pink" onclick="share()">Share our plan 💌</button><div class="small">Screenshot this and send it to me! 💕</div>`)}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function share(){const msg=`💗 I said YES!\n🎀 Activity: ${activity}\n📍 Vibe: ${place}\n💌 Contact: ${contact||'We’ll figure it out together'}`;if(navigator.share){try{await navigator.share({text:msg});return}catch(e){}}try{await navigator.clipboard.writeText(msg);alert('Our plan was copied! 💗')}catch(e){prompt('Copy our plan:',msg)}}
intro();
</script>
</body>
</html>
